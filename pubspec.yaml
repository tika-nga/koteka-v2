name: flutter_marketplace_template
description: "Koteka - application de petites annonces."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend Koteka
  supabase_flutter: ^2.8.4

  # Gestion d'état
  provider: ^6.1.4

  # Localisation / distance
  geolocator: ^14.0.2

  # Configuration
  flutter_dotenv: ^5.1.0

  # Localisation Flutter
  intl: any

  # Stockage local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Réseau / liens
  http: ^1.4.0
  url_launcher: ^6.2.5

  # Interface
  material_symbols_icons: ^4.2960.0
  scrollable_positioned_list: ^0.3.8

  # Photos
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  permission_handler: ^11.0.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

  # Utilitaires
  logger: ^2.5.0
  tuple: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - .env

  fonts:
    - family: MPlus1p
      fonts:
        - asset: assets/fonts/M_PLUS_1p/MPLUS1p-Medium.ttf
          weight: 500
        - asset: assets/fonts/M_PLUS_1p/MPLUS1p-Bold.ttf
          weight: 700
        - asset: assets/fonts/M_PLUS_1p/MPLUS1p-Light.ttf
          weight: 300

    - family: NATS
      fonts:
        - asset: assets/fonts/NATS/NATS-Regular.ttf
          weight: 400
