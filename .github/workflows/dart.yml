name: Build Koteka APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Préparer les propriétés Android
        run: cp android/local.defaults.properties.example android/local.defaults.properties
     
      - name: Préparer les fichiers environnement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERREUR : SUPABASE_URL est vide"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERREUR : SUPABASE_ANON_KEY est vide"
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "ERREUR : SUPABASE_URL n'est pas valide"
              exit 1
              ;;
          esac

          cp map_key.env.example map_key.env
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          echo "Configuration Supabase OK"
      - name: Préparer Firebase pour le build test
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "koteka-debug",
              "storage_bucket": "koteka-debug.appspot.com"
           },
           "client": [
             {
          "client_info": {
            "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
            "android_client_info": {
              "package_name": "com.mpitsol.randki"
            }
          },
          "api_key": [
            {
              "current_key": "AIzaSyDebugKotekaTemporaryKey"
                }
              ]
            }
          ],
          "configuration_version": "1"
          }
          EOF

      - name: Compiler APK
        run: flutter build apk --debug

      - name: Sauvegarder APK Koteka
        uses: actions/upload-artifact@v4
        with:
          name: koteka-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
